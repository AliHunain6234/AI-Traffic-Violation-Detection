<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Traffic Control Room</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='10' y='2' width='12' height='28' rx='4' fill='%23312e81'/%3E%3Ccircle cx='16' cy='9' r='3' fill='%23ef4444'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23f59e0b'/%3E%3Ccircle cx='16' cy='23' r='3' fill='%2322c55e'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try { document.documentElement.dataset.theme = localStorage.getItem("tvd_theme") || "dark"; } catch (e) {}
      // Performance mode ("lite"): no animated background or effects. ?perf=lite|full overrides and is remembered.
      try {
        var q = new URLSearchParams(location.search).get("perf");
        if (q === "lite" || q === "full") localStorage.setItem("tvd_perf", q);
        document.documentElement.dataset.perf = localStorage.getItem("tvd_perf") || "full";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
